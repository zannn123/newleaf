<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">newleaf</title>
  <desc id="banner-desc">newleaf for Claude Code. New page. Nothing lost. 86 percent fewer tokens per task, measured on the same task.</desc>
  <style>
    .bg { fill: #F6FAF4; }
    .disc { fill: #E4F6E9; }
    .ink { fill: #0F1A12; }
    .muted { fill: #536657; }
    .accent { fill: #16A34A; }
    .rib { stroke: #F6FAF4; }
    .stem { stroke: #16A34A; }
    .rule { stroke: #DCE8DD; }
    .pill { fill: #FFFFFF; stroke: #DCE8DD; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0B110D; }
      .disc { fill: #153A24; }
      .ink { fill: #ECF7EF; }
      .muted { fill: #94A89A; }
      .accent { fill: #4ADE80; }
      .rib { stroke: #0B110D; }
      .stem { stroke: #4ADE80; }
      .rule { stroke: #223326; }
      .pill { fill: #111A14; stroke: #223326; }
    }
  </style>
  <rect class="bg" width="1280" height="360" rx="28"/>

  <!-- the leaf -->
  <g transform="translate(166 180)">
    <circle class="disc" r="108"/>
    <path class="accent" d="M -58 58 C -58 -14 -14 -58 58 -58 C 58 14 14 58 -58 58 Z"/>
    <path class="rib" d="M -50 50 Q 0 6 46 -46" fill="none" stroke-width="5" stroke-linecap="round"/>
    <path class="rib" d="M -14 14 L -16 -14 M 10 -10 L 30 -8 M -2 2 L 22 6" fill="none" stroke-width="3.5" stroke-linecap="round"/>
    <path class="stem" d="M -58 58 L -80 80" fill="none" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- the name -->
  <text x="316" y="190" font-size="104" font-weight="800" letter-spacing="-3" class="ink">new<tspan class="accent">leaf</tspan></text>
  <text x="320" y="240" font-size="30" class="muted">New page. Nothing lost.</text>
  <rect class="pill" x="320" y="262" width="196" height="42" rx="21" stroke-width="1.5"/>
  <text x="418" y="290" font-size="18" font-weight="600" text-anchor="middle" class="ink">for Claude Code</text>

  <!-- the measured result -->
  <line class="rule" x1="880" y1="88" x2="880" y2="272" stroke-width="1.5"/>
  <text x="1196" y="176" font-size="92" font-weight="800" letter-spacing="-2" text-anchor="end" class="accent">−86%</text>
  <text x="1196" y="218" font-size="22" font-weight="600" text-anchor="end" class="ink">tokens per task</text>
  <text x="1196" y="248" font-size="17" text-anchor="end" class="muted">measured, same task, same quality</text>
</svg>
