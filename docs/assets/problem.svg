<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">Every step re-sends the whole chat</title>
  <desc id="d">Median tokens re-sent per step: 447k in a resumed long chat, 52k in a fresh session with newleaf.</desc>
  <style>
    .bg { fill: #F6FAF4; } .card { fill: #FFFFFF; stroke: #DCE8DD; stroke-width: 1.5; }
    .ink { fill: #0F1A12; } .muted { fill: #536657; } .accent { fill: #16A34A; } .old { fill: #B4C2B8; }
    .grid { stroke: #E3ECE4; stroke-width: 1; } .tick { fill: #7C8E80; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0B110D; } .card { fill: #111A14; stroke: #223326; }
      .ink { fill: #ECF7EF; } .muted { fill: #94A89A; } .accent { fill: #4ADE80; } .old { fill: #4A5E50; }
      .grid { stroke: #1D2B21; } .tick { fill: #6F8475; }
    }
  </style>
  <rect class="bg" width="1280" height="420" rx="28"/>
  <text x="48" y="78" font-size="30" font-weight="800" class="ink">Every step re-sends the whole chat</text>
  <text x="48" y="110" font-size="17" class="muted">Tokens re-sent on each step of the same task. Bar: the runs' median step. Line: from the smallest first step to the largest step.</text>
  <text x="48" y="188" font-size="21" font-weight="700" class="ink">Resumed long chat</text>
  <text x="48" y="214" font-size="15" class="muted">2 runs, about 13 steps each</text>
  <line class="grid" x1="1129.2" x2="1160.0" y1="192" y2="192" stroke-width="3"/>
  <rect class="old" x="340" y="172" width="801.6" height="40" rx="8"/>
  <text x="1176" y="200" font-size="20" font-weight="700" class="ink">447k per step</text>
  <text x="48" y="292" font-size="21" font-weight="700" class="ink">Fresh session + newleaf</text>
  <text x="48" y="318" font-size="15" class="muted">3 runs, about 15 steps each</text>
  <line class="grid" x1="417.0" x2="448.7" y1="296" y2="296" stroke-width="3"/>
  <rect class="accent" x="340" y="276" width="92.7" height="40" rx="8"/>
  <text x="465" y="304" font-size="20" font-weight="700" class="ink">52k per step</text>
  <text x="48" y="390" font-size="15" class="muted">From Claude Code's own session logs. Data: docs/proof/runs.csv</text>
</svg>
