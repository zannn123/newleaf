name: tests

on:
  push:
  pull_request:

jobs:
  hooks:
    name: hooks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Hook tests (bash, no Python)
        shell: bash
        run: bash tests/hooks.sh
      - name: Codex hooks the way Codex runs them on Windows (cmd.exe /C)
        if: runner.os == 'Windows'
        run: python tests/windows_cmd.py
